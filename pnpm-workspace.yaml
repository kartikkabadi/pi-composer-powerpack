packages:
  - "."

# Allow fresh transitive deps when refreshing the lockfile locally (CI uses frozen lockfile).
minimumReleaseAge: 0

allowBuilds:
  '@google/genai': true
  koffi: true
  protobufjs: true
  sqlite3: true
minimumReleaseAgeExclude:
  - pi-cursor-sdk
  - node-addon-api
  - semver

overrides:
  "sqlite3": "6.0.1"
  "tar": "7.5.21"
  "undici": "7.29.1"
  "protobufjs": "7.6.5"
  "brace-expansion": "5.0.12"
  "body-parser": "2.3.0"
  "hono": "4.13.11"
  "fast-uri": "3.1.8"
  "ip-address": "10.7.1"
  "@hono/node-server": "1.19.15"
  "qs": "6.16.0"
  "proxy-addr": "2.0.8"
  "@modelcontextprotocol/sdk": "1.32.0"

onlyBuiltDependencies:
  - "@google/genai"
  - koffi
  - protobufjs
  - sqlite3
