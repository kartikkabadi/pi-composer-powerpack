name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Secret scan
        run: pnpm run check:secrets

      - name: Pack dry-run
        run: pnpm run pack:dry

      - name: Lint extensions
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: node --experimental-strip-types --test test/*.test.mjs

  linux-smoke:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      matrix:
        image: [node:22-trixie, node:22-bookworm]
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Install git and curl
        run: apt-get update && apt-get install -y git curl

      - name: Install Pi CLI
        run: npm install -g @earendil-works/pi-coding-agent@0.75.4

      - name: Install powerpack from checkout
        run: pi install file://$(pwd)

      - name: Check cursor-fast flag availability
        run: |
          if pi --help 2>&1 | grep -q cursor-fast; then
            echo "PASS: --cursor-fast present on ${{ matrix.image }}"
          else
            echo "WARN: --cursor-fast missing on ${{ matrix.image }} (expected on bookworm)"
            if echo "${{ matrix.image }}" | grep -q bookworm; then
              exit 0
            fi
            exit 1
          fi
